<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>在线沙盒 · 麦芽糖bot</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --panel-2: #f2f3f5;
    --text: #1f2329;
    --mute: #8a9099;
    --border: #e3e5e8;
    --accent: #3eaf7c;
    --accent-weak: #e8f6ef;
    --danger: #e5484d;
    --radius: 12px;
    --shadow: 0 6px 24px rgba(20, 24, 32, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181c;
      --panel: #1e2025;
      --panel-2: #26282e;
      --text: #e6e8eb;
      --mute: #9096a0;
      --border: #33363d;
      --accent: #4cc38a;
      --accent-weak: #1d2c25;
      --shadow: 0 6px 24px rgba(0, 0, 0, .45);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); overflow: hidden;
  }
  .app { display: flex; height: 100vh; }

  /* ---------------- 侧栏 ---------------- */
  .side {
    width: 268px; flex: none; display: flex; flex-direction: column;
    background: var(--panel); border-right: 1px solid var(--border);
  }
  .side-head { padding: 14px 14px 10px; border-bottom: 1px solid var(--border); }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
  .brand .logo { font-size: 18px; }
  .status { margin-top: 8px; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--mute); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mute); flex: none; }
  .dot.on { background: #27c93f; }
  .dot.off { background: var(--danger); }
  .search { padding: 10px 12px; }
  .search input {
    width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text); font-size: 13px; outline: none;
  }
  .search input:focus { border-color: var(--accent); }
  .cmds { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
  .cmd {
    padding: 7px 10px; border-radius: 8px; font-size: 12.5px; cursor: pointer;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cmd:hover { background: var(--accent-weak); color: var(--accent); }
  .cmds-empty { padding: 16px 10px; color: var(--mute); font-size: 12.5px; }

  /* ---------------- 主区 ---------------- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .top {
    display: flex; align-items: center; gap: 10px; padding: 12px 16px;
    border-bottom: 1px solid var(--border); background: var(--panel);
  }
  .top h1 { margin: 0; font-size: 15px; font-weight: 700; }
  .top .spacer { flex: 1; }
  .btn {
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    padding: 6px 12px; border-radius: 8px; font-size: 12.5px; cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }

  .chat { flex: 1; overflow-y: auto; padding: 18px 16px; }
  .welcome { max-width: 620px; margin: 8vh auto 0; text-align: center; color: var(--mute); }
  .welcome h2 { color: var(--text); font-size: 18px; margin: 0 0 8px; }
  .welcome p { margin: 6px 0; font-size: 13px; }
  .welcome code {
    background: var(--panel-2); padding: 2px 6px; border-radius: 6px;
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px;
  }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
  .example {
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    padding: 6px 12px; border-radius: 999px; font-size: 12.5px; cursor: pointer;
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  .example:hover { border-color: var(--accent); color: var(--accent); }

  .msg { display: flex; margin-bottom: 12px; }
  .msg.user { justify-content: flex-end; }
  .msg.bot { justify-content: flex-start; }
  .bubble {
    max-width: 76%; padding: 9px 13px; border-radius: 12px;
    white-space: pre-wrap; word-break: break-word; box-shadow: var(--shadow);
  }
  .msg.user .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 3px; }
  .msg.bot .bubble { background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 3px; }
  .msg.bot .bubble.warn { color: var(--mute); font-size: 12.5px; box-shadow: none; }
  /* 图片按缩略图显示，点开看大图（原来 max-width:100% 会撑满气泡，截图能占满整屏） */
  .bubble img {
    display: block; width: auto; height: auto;
    max-width: 220px; max-height: 220px;
    object-fit: contain; border-radius: 8px; margin: 4px 0;
    cursor: zoom-in; background: var(--panel-2);
  }

  /* 点开看大图 */
  .lightbox {
    position: fixed; inset: 0; z-index: 3000;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; background: rgba(0, 0, 0, .82); cursor: zoom-out;
  }
  .lightbox[hidden] { display: none; }
  .lightbox img {
    max-width: 100%; max-height: 100%;
    border-radius: 8px; box-shadow: 0 12px 48px rgba(0, 0, 0, .5);
  }

  /* 语音 / 视频 / 文件 */
  .media-play { display: block; width: 260px; max-width: 100%; margin: 2px 0 4px; }
  .media-meta { font-size: 11.5px; color: var(--mute); }
  .file-link {
    display: inline-block; padding: 7px 11px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel-2);
    color: var(--text); text-decoration: none; font-size: 13px; word-break: break-all;
  }
  .file-link:hover { border-color: var(--accent); color: var(--accent); }

  /* 机器人回复里的 markdown */
  .bubble p { margin: 0 0 8px; }
  .bubble > *:last-child { margin-bottom: 0; }
  .bubble h1, .bubble h2, .bubble h3, .bubble h4 {
    margin: 12px 0 6px; font-size: 1.05em; font-weight: 700; line-height: 1.4;
  }
  .bubble h1 { font-size: 1.15em; }
  .bubble ul, .bubble ol { margin: 6px 0; padding-left: 20px; }
  .bubble li { margin: 3px 0; }
  .bubble li > p { margin: 0; }
  .bubble code {
    background: var(--panel-2); padding: 1.5px 5px; border-radius: 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px;
  }
  .bubble pre {
    background: var(--panel-2); padding: 10px 12px; border-radius: 8px;
    overflow-x: auto; margin: 8px 0;
  }
  .bubble pre code { background: none; padding: 0; font-size: 12.5px; }
  .bubble blockquote {
    margin: 8px 0; padding: 2px 0 2px 10px;
    border-left: 3px solid var(--border); color: var(--mute);
  }
  .bubble table { border-collapse: collapse; margin: 8px 0; font-size: 13px; }
  .bubble th, .bubble td { border: 1px solid var(--border); padding: 4px 9px; }
  .bubble th { background: var(--panel-2); }
  .bubble hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
  .bubble a { color: var(--accent); text-decoration: underline; word-break: break-all; }
  .msg.user .bubble a { color: #fff; }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%; flex: none; margin: 0 8px;
    background: var(--panel-2); display: grid; place-items: center; font-size: 14px;
  }

  .typing { display: flex; gap: 4px; align-items: center; padding: 12px 14px; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--mute); display: block; animation: b 1s infinite ease-in-out; }
  .typing i:nth-child(2) { animation-delay: .15s; }
  .typing i:nth-child(3) { animation-delay: .3s; }
  .typing-secs { margin-left: 6px; font-size: 12px; color: var(--mute); }
  @keyframes b { 0%,80%,100% { opacity: .3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }

  .foot { padding: 12px 16px 16px; border-top: 1px solid var(--border); background: var(--panel); }
  .input-row { display: flex; gap: 10px; }
  .input-row input {
    flex: 1; min-width: 0; padding: 11px 14px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    font-size: 14px; outline: none;
  }
  .input-row input:focus { border-color: var(--accent); }
  .run {
    padding: 11px 22px; border: none; border-radius: 10px; background: var(--accent);
    color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .run:disabled { opacity: .5; cursor: not-allowed; }
  .hint { margin-top: 8px; font-size: 12px; color: var(--mute); }

  .attach {
    flex: none; width: 42px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--panel-2); color: var(--text); font-size: 17px; cursor: pointer;
  }
  .attach:hover { border-color: var(--accent); }
  .attachments { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .attachments:empty { display: none; }
  .att {
    position: relative; width: 56px; height: 56px; border-radius: 8px;
    overflow: hidden; border: 1px solid var(--border); background: var(--panel-2);
  }
  .att img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .att button {
    position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; padding: 0;
    border: none; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff;
    font-size: 11px; line-height: 16px; cursor: pointer;
  }
  .drop-hint {
    position: absolute; inset: 0; z-index: 20; display: grid; place-items: center;
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    border: 2px dashed var(--accent); border-radius: 12px;
    font-size: 15px; font-weight: 600; color: var(--accent); pointer-events: none;
  }

  .menu-btn { display: none; }
  @media (max-width: 760px) {
    .side { position: fixed; inset: 0 auto 0 0; z-index: 10; transform: translateX(-100%); transition: transform .2s ease; }
    .side.open { transform: none; box-shadow: var(--shadow); }
    .menu-btn { display: inline-block; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="side-head">
      <div class="brand"><span class="logo">🕹️</span><span>在线沙盒</span></div>
      <div class="status"><span class="dot" id="dot"></span><span id="state">连接中…</span></div>
    </div>
    <div class="search"><input id="filter" type="search" placeholder="筛选指令…" autocomplete="off" /></div>
    <div class="cmds" id="cmds"><div class="cmds-empty">正在加载指令…</div></div>
  </aside>

  <main class="main">
    <div class="top">
      <button class="btn menu-btn" id="menu">指令</button>
      <h1>麦芽糖bot · 真机试运行</h1>
      <span class="spacer"></span>
      <button class="btn" id="reload">刷新指令</button>
      <button class="btn" id="newsession" title="换一段干净的对话（多轮流程的状态会重置）">新会话</button>
      <button class="btn" id="clear">清空</button>
    </div>

    <div class="chat" id="chat">
      <div class="welcome" id="welcome">
        <h2>在浏览器里直接跑 bot 的指令</h2>
        <p>这里连的是真实运行的 koishi 实例，回复就是机器人真正发出来的内容。</p>
        <p>左边挑一条指令，或者在下面直接输入。</p>
        <div class="examples" id="examples"></div>
      </div>
    </div>

    <div class="foot">
      <div class="attachments" id="atts"></div>
      <div class="input-row">
        <button class="attach" id="attach" title="发送图片（也可以直接粘贴或拖进来）">🖼️</button>
        <input type="file" id="file" accept="image/*" multiple hidden />
        <input id="input" type="text" placeholder="输入指令，或直接发一张图片" autocomplete="off" />
        <button class="run" id="run">运行</button>
      </div>
      <div class="hint" id="hint">Enter 运行 · ↑ / ↓ 翻历史 · 可粘贴 / 拖入图片</div>
    </div>
  </main>
</div>

<div class="lightbox" id="lightbox" hidden><img id="lightboxImg" alt="查看大图" /></div>

<!-- 本地 vendored 的 marked（MIT），不依赖 CDN -->
<script src="marked.umd.js"></script>
<script>
(function () {
  'use strict';
  var API = location.pathname.replace(/\/index\.html$/, '').replace(/\/+$/, '');
  if (!API) API = '/sandbox';

  var el = function (id) { return document.getElementById(id); };
  var chat = el('chat'), input = el('input'), runBtn = el('run');
  var cmdsBox = el('cmds'), filterBox = el('filter');
  var dot = el('dot'), state = el('state'), hint = el('hint');
  var commands = [], history = [], hIndex = -1, busy = false;
  var attachments = [];
  var runToken = 0;   // 每次运行一个号，用来区分「这是谁的转圈」

  // ---- 会话 id ----
  // 同一个 id 视为同一段对话，插件按频道保存的多轮状态（拼图先收图再合成等）才能延续
  function newSessionId() {
    return 'sbx' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  var sessionId = '';
  try { sessionId = localStorage.getItem('docs-sandbox-session') || ''; } catch (e) {}
  if (!sessionId) {
    sessionId = newSessionId();
    try { localStorage.setItem('docs-sandbox-session', sessionId); } catch (e) {}
  }

  // ---- 图片附件 ----
  function renderAtts() {
    var box = el('atts');
    box.textContent = '';
    attachments.forEach(function (dataUrl, i) {
      var d = document.createElement('div');
      d.className = 'att';
      var img = document.createElement('img');
      img.src = dataUrl;
      img.alt = '待发送图片';
      d.appendChild(img);
      var x = document.createElement('button');
      x.type = 'button';
      x.textContent = '×';
      x.title = '移除';
      x.addEventListener('click', function () { attachments.splice(i, 1); renderAtts(); });
      d.appendChild(x);
      box.appendChild(d);
    });
  }

  function readAsDataURL(file) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(String(r.result)); };
      r.onerror = function () { reject(new Error('读取失败')); };
      r.readAsDataURL(file);
    });
  }

  // 大图先缩到长边 1600 再发；小图原样保留（避免透明通道被 JPEG 压成黑底）
  function downscale(file, maxSide, quality) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        try {
          var scale = Math.min(1, maxSide / Math.max(img.width, img.height));
          var cv = document.createElement('canvas');
          cv.width = Math.max(1, Math.round(img.width * scale));
          cv.height = Math.max(1, Math.round(img.height * scale));
          cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
          URL.revokeObjectURL(url);
          resolve(cv.toDataURL('image/jpeg', quality));
        } catch (e) {
          URL.revokeObjectURL(url);
          reject(e);
        }
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('不是有效图片')); };
      img.src = url;
    });
  }

  // 单张图目标体积：3 张叠起来要能塞进后端 4MB 上限
  var TARGET_IMAGE_BYTES = 800 * 1024;

  function dataUrlBytes(url) {
    var comma = url.indexOf(',');
    if (comma < 0) return 0;
    return Math.floor((url.length - comma - 1) * 3 / 4);
  }

  // 反复压到目标以内。只压一次不够：1600px@0.9 的截图照样能到两三 MB
  function compressToTarget(file, targetBytes) {
    if (file.size <= 300 * 1024) return readAsDataURL(file);
    var side = 1600, quality = 0.9;
    return downscale(file, side, quality).then(function step(out) {
      var i = 0;
      function again(cur) {
        if (i >= 8 || dataUrlBytes(cur) <= targetBytes) return cur;
        i++;
        quality = Math.max(0.5, Math.round((quality - 0.1) * 100) / 100);
        side = Math.max(640, Math.round(side * 0.85));
        return downscale(file, side, quality).then(again);
      }
      return again(out);
    });
  }

  function prepare(file) {
    if (!/^image\//.test(file.type || '')) return Promise.reject(new Error('只支持图片'));
    return compressToTarget(file, TARGET_IMAGE_BYTES).then(function (url) {
      if (dataUrlBytes(url) > TARGET_IMAGE_BYTES * 1.5) throw new Error('压缩后仍然过大');
      return url;
    });
  }

  function addFiles(files) {
    var list = Array.prototype.slice.call(files || []).filter(function (f) { return /^image\//.test(f.type || ''); });
    if (!list.length) return;
    var room = Math.max(0, 3 - attachments.length);
    var accepted = list.slice(0, room);
    var over = list.length - accepted.length;
    hint.textContent = '正在处理图片…';
    Promise.all(accepted.map(function (f) {
      return prepare(f).catch(function () { return null; });
    })).then(function (urls) {
      var ok = 0;
      urls.forEach(function (u) { if (u) { attachments.push(u); ok++; } });
      var bad = over + (urls.length - ok);
      if (bad > 0) hint.textContent = '已添加 ' + ok + ' 张，' + bad + ' 张被跳过（超出数量或压缩后仍过大）';
      renderAtts();
      input.focus();
    }).then(function () {
      setTimeout(function () {
        hint.textContent = 'Enter 运行 · ↑ / ↓ 翻历史 · 可粘贴 / 拖入图片';
      }, 2500);
    });
  }

  var EXAMPLES = ['abbr yyds', 'thursday', '来个绕口令', 'roll 1d20', '抽象话 你好', 'mc.ver'];

  function setState(ok, text) {
    dot.className = 'dot ' + (ok ? 'on' : 'off');
    state.textContent = text;
  }

  function scrollDown() { chat.scrollTop = chat.scrollHeight; }

  function hideWelcome() {
    var w = el('welcome');
    if (w) w.remove();
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // 原始 HTML 一律当纯文本，避免机器人把用户输入原样带回来时被当成标签执行
  if (window.marked && window.marked.use) {
    window.marked.use({
      renderer: {
        html: function (token) {
          return escapeHtml((token && (token.text || token.raw)) || '');
        },
      },
    });
  }

  function sanitize(html) {
    return String(html)
      .replace(/\s(href|src)\s*=\s*"(\s*(?:javascript|vbscript|data:text\/html)[^"]*)"/gi, ' data-blocked="$2"')
      .replace(/<a\s/gi, '<a target="_blank" rel="noopener noreferrer" ');
  }

  function mdToHtml(text) {
    if (!window.marked || !window.marked.parse) return escapeHtml(text);
    try {
      return sanitize(window.marked.parse(String(text), { breaks: true, gfm: true }));
    } catch (e) {
      return escapeHtml(text);
    }
  }

  function renderMarkdown(text) {
    var frag = document.createDocumentFragment();
    var box = document.createElement('div');
    box.innerHTML = mdToHtml(text);
    while (box.firstChild) frag.appendChild(box.firstChild);
    return frag;
  }

  function addMsg(role, text, url, warn) {
    hideWelcome();
    var row = document.createElement('div');
    row.className = 'msg ' + role;
    if (role === 'bot') {
      var av = document.createElement('div');
      av.className = 'avatar';
      av.textContent = '🍬';
      row.appendChild(av);
    }
    var b = document.createElement('div');
    b.className = 'bubble' + (warn ? ' warn' : '');
    if (url) {
      var img = document.createElement('img');
      img.src = url;
      img.alt = '回复图片';
      b.appendChild(img);
    }
    if (text) {
      // 机器人的回复常带 markdown（标题 / 列表 / 加粗），渲染出来；用户输入保持纯文本
      if (role === 'bot') b.appendChild(renderMarkdown(text));
      else b.appendChild(document.createTextNode(text));
    }
    if (!text && !url) b.appendChild(document.createTextNode('（空）'));
    row.appendChild(b);
    chat.appendChild(row);
    scrollDown();
    return row;
  }

  var typingTimer = null, typingStart = 0, typingToken = 0;

  function addTyping(token) {
    hideWelcome();
    removeTyping();
    typingToken = token;
    typingStart = Date.now();
    var row = document.createElement('div');
    row.className = 'msg bot';
    row.id = 'typing';
    row.innerHTML = '<div class="avatar">🍬</div><div class="bubble typing">'
      + '<i></i><i></i><i></i><span class="typing-secs" id="typingSecs"></span></div>';
    chat.appendChild(row);
    scrollDown();
    // 慢指令（AI 问答 / 图片生成）要等十几秒，让人看见还在跑
    typingTimer = setInterval(function () {
      var s = el('typingSecs');
      if (!s) return;
      var sec = Math.round((Date.now() - typingStart) / 1000);
      s.textContent = sec >= 3 ? (sec + 's') : '';
    }, 500);
  }

  // token 归属：旧流的收尾不该把新流的转圈删掉
  function removeTyping(token) {
    if (token !== undefined && token !== typingToken) return;
    if (typingTimer) { clearInterval(typingTimer); typingTimer = null; }
    var t = el('typing');
    if (t) t.remove();
  }

  function releaseBusy() {
    busy = false;
    runBtn.disabled = false;
    runBtn.textContent = '运行';
  }

  // 没反应时，按服务端给的信息说清楚是哪种情况
  function noReplyHint(meta) {
    if (meta && meta.known === false && !meta.warm) {
      return '（这看起来不是一条指令 —— 左边列表里挑一条，或者检查一下拼写？）';
    }
    if (meta && meta.known === false && meta.warm) {
      return '（没有回复。如果是多轮流程（拼图这类），可以直接发「完成」等下一步；否则可能是拼写问题。）';
    }
    return '（没有收到回复 —— 可能较慢、需要登录态，或依赖图片渲染）';
  }

  function formatSize(n) {
    if (n === undefined || n === null) return '';
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1048576).toFixed(1) + ' MB';
  }

  // 语音 / 视频 / 文件：语音如果是 SILK，后端已经转成 WAV 了，这里直接播
  function addMedia(kind, o) {
    hideWelcome();
    var row = document.createElement('div');
    row.className = 'msg bot';
    var av = document.createElement('div');
    av.className = 'avatar';
    av.textContent = '🍬';
    row.appendChild(av);

    var b = document.createElement('div');
    b.className = 'bubble';

    if (kind === 'audio' || kind === 'video') {
      var media = document.createElement(kind);
      media.controls = true;
      media.src = o.url;
      media.className = 'media-play';
      if (kind === 'video') media.playsInline = true;
      b.appendChild(media);
      var meta = document.createElement('div');
      meta.className = 'media-meta';
      meta.textContent = (o.name || kind) + (o.note ? ' · ' + o.note : '');
      b.appendChild(meta);
    } else {
      var link = document.createElement('a');
      link.className = 'file-link';
      link.href = o.url;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.setAttribute('download', o.name || '');
      link.textContent = '📎 ' + (o.name || '文件') + (o.size ? '（' + formatSize(o.size) + '）' : '');
      b.appendChild(link);
    }

    row.appendChild(b);
    chat.appendChild(row);
    scrollDown();
  }

  function showOutputs(outs) {
    var shown = 0;
    (outs || []).forEach(function (o) {
      if (o.type === 'image' && o.url) { addMsg('bot', null, o.url); shown++; }
      else if ((o.type === 'audio' || o.type === 'video' || o.type === 'file') && o.url) { addMedia(o.type, o); shown++; }
      else if (o.text) { addMsg('bot', o.text); shown++; }
    });
    return shown;
  }

  function run(command) {
    command = (command === undefined ? input.value : command).trim();
    // 允许只发图片：有些指令（表情包 / 图像处理）本来就吃图不吃字
    if ((!command && !attachments.length) || busy) return;
    var images = attachments.slice();
    attachments = [];
    renderAtts();

    busy = true;
    runBtn.disabled = true;
    runBtn.textContent = '…';
    input.value = '';
    if (command) { history.push(command); hIndex = -1; }
    if (command) addMsg('user', command);
    images.forEach(function (u) { addMsg('user', null, u); });
    addTyping(token);

    var got = 0;
    var pending = '';
    var meta = {};
    var token = ++runToken;

    function handle(line) {
      var ev;
      try { ev = JSON.parse(line); } catch (e) { return; }
      if (ev.type === 'chunk') {
        removeTyping(token);
        got += showOutputs(ev.outputs);
      } else if (ev.type === 'done') {
        meta = ev;
      } else if (ev.type === 'error') {
        removeTyping(token);
        addMsg('bot', '⚠️ ' + ev.error, null, true);
      }
    }

    // 流式：慢指令（AI 问答 / 截图）边跑边出，不会被等待窗口截断
    fetch(API + '/api/run?stream=1', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ command: command, images: images, sessionId: sessionId })
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      var reader = r.body.getReader();
      var dec = new TextDecoder();
      function pump() {
        return reader.read().then(function (res) {
          if (res.done) return;
          pending += dec.decode(res.value, { stream: true });
          var i;
          while ((i = pending.indexOf('\n')) >= 0) {
            handle(pending.slice(0, i).trim());
            pending = pending.slice(i + 1);
          }
          return pump();
        });
      }
      return pump();
    }).catch(function (err) {
      removeTyping(token);
      addMsg('bot', '⚠️ 请求失败：' + err.message, null, true);
    }).then(function () {
      removeTyping(token);
      if (!got) addMsg('bot', noReplyHint(meta), null, true);
      releaseBusy();
      input.focus();
    });

    // 不锁输入框：流还在跑，但用户可以立刻发下一条。
    // 服务端看到同会话有新请求，会让上一条的「等后续」立刻收工，
    // 所以打错字之后不用干等（迟到的回复照样会冒出来）。
    releaseBusy();
  }

  function renderCommands() {
    var kw = (filterBox.value || '').trim().toLowerCase();
    var list = commands.filter(function (c) { return !kw || c.toLowerCase().indexOf(kw) >= 0; });
    cmdsBox.textContent = '';
    if (!list.length) {
      var e = document.createElement('div');
      e.className = 'cmds-empty';
      e.textContent = commands.length ? '没有匹配的指令' : '暂无可用指令';
      cmdsBox.appendChild(e);
      return;
    }
    list.slice(0, 400).forEach(function (name) {
      var d = document.createElement('div');
      d.className = 'cmd';
      d.textContent = name;
      d.title = '单击填入 · 双击直接运行';
      d.addEventListener('click', function () { input.value = name; input.focus(); });
      d.addEventListener('dblclick', function () { run(name); });
      cmdsBox.appendChild(d);
    });
  }

  function loadCommands() {
    return fetch(API + '/api/commands', { cache: 'no-store' }).then(function (r) {
      return r.json();
    }).then(function (data) {
      commands = data.commands || [];
      setState(true, commands.length + ' 条指令可用');
      renderCommands();
      renderExamples();
      hint.textContent = 'Enter 运行 · ↑ / ↓ 翻历史 · 共 ' + commands.length + ' 条指令';
    }).catch(function () {
      commands = [];
      setState(false, '连不上沙盒接口');
      cmdsBox.innerHTML = '';
      var e = document.createElement('div');
      e.className = 'cmds-empty';
      e.textContent = '连不上 ' + API + '/api/commands，请确认插件已启用。';
      cmdsBox.appendChild(e);
    });
  }

  function renderExamples() {
    var box = el('examples');
    if (!box) return;
    var picks = EXAMPLES.filter(function (c) {
      var root = c.split(/\s/)[0];
      return commands.some(function (x) { return x === root || x.split(/\s/)[0] === root; });
    });
    if (!picks.length) picks = commands.slice(0, 6);
    picks.slice(0, 6).forEach(function (c) {
      var b = document.createElement('button');
      b.className = 'example';
      b.textContent = c;
      b.addEventListener('click', function () { run(c); });
      box.appendChild(b);
    });
  }

  // 点图片看大图
  var lightbox = el('lightbox');
  chat.addEventListener('click', function (ev) {
    var t = ev.target;
    if (t && t.tagName === 'IMG' && t.closest('.bubble')) {
      el('lightboxImg').src = t.src;
      lightbox.hidden = false;
    }
  });
  lightbox.addEventListener('click', function () { lightbox.hidden = true; });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && !lightbox.hidden) lightbox.hidden = true;
  });

  runBtn.addEventListener('click', function () { run(); });

  // ---- 图片：按钮 / 粘贴 / 拖入 ----
  el('attach').addEventListener('click', function () { el('file').click(); });
  el('file').addEventListener('change', function (ev) {
    addFiles(ev.target.files);
    ev.target.value = '';
  });
  input.addEventListener('paste', function (ev) {
    var items = (ev.clipboardData && ev.clipboardData.items) || [];
    var files = [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].kind === 'file') {
        var f = items[i].getAsFile();
        if (f) files.push(f);
      }
    }
    if (files.length) { ev.preventDefault(); addFiles(files); }
  });
  ['dragenter', 'dragover'].forEach(function (name) {
    document.addEventListener(name, function (ev) {
      if (!ev.dataTransfer || Array.prototype.indexOf.call(ev.dataTransfer.types || [], 'Files') < 0) return;
      ev.preventDefault();
      if (!el('dropHint')) {
        var d = document.createElement('div');
        d.className = 'drop-hint';
        d.id = 'dropHint';
        d.textContent = '松手即可添加图片';
        document.body.appendChild(d);
      }
    });
  });
  document.addEventListener('dragleave', function (ev) {
    if (ev.relatedTarget) return;
    var d = el('dropHint'); if (d) d.remove();
  });
  document.addEventListener('drop', function (ev) {
    var d = el('dropHint'); if (d) d.remove();
    if (!ev.dataTransfer || !ev.dataTransfer.files || !ev.dataTransfer.files.length) return;
    ev.preventDefault();
    addFiles(ev.dataTransfer.files);
  });

  // ---- 新会话 ----
  el('newsession').addEventListener('click', function () {
    sessionId = newSessionId();
    try { localStorage.setItem('docs-sandbox-session', sessionId); } catch (e) {}
    attachments = [];
    renderAtts();
    chat.textContent = '';
    var w = document.createElement('div');
    w.className = 'welcome';
    w.id = 'welcome';
    w.innerHTML = '<h2>已开启新会话</h2><p>多轮流程的状态已经重置，可以重新开始了。</p>';
    chat.appendChild(w);
  });
  el('clear').addEventListener('click', function () {
    chat.textContent = '';
    var w = document.createElement('div');
    w.className = 'welcome';
    w.id = 'welcome';
    w.innerHTML = '<h2>会话已清空</h2><p>继续输入指令即可试运行。</p>';
    chat.appendChild(w);
  });
  el('reload').addEventListener('click', loadCommands);
  el('menu').addEventListener('click', function () { el('side').classList.toggle('open'); });
  filterBox.addEventListener('input', renderCommands);

  input.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') { run(); return; }
    if (ev.key === 'ArrowUp') {
      if (!history.length) return;
      hIndex = hIndex < 0 ? history.length - 1 : Math.max(0, hIndex - 1);
      input.value = history[hIndex];
      ev.preventDefault();
    }
    if (ev.key === 'ArrowDown') {
      if (hIndex < 0) return;
      hIndex += 1;
      if (hIndex >= history.length) { hIndex = -1; input.value = ''; }
      else input.value = history[hIndex];
      ev.preventDefault();
    }
  });

  loadCommands();
  input.focus();
})();
</script>
</body>
</html>
